name: Generate Release Promotion Draft

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate release promotion draft
        run: python scripts/generate_release_promo.py

      - name: Commit promotion draft
        run: |
          git config user.name "github-growth-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add release-promotion-draft.md
          git diff --cached --quiet || git commit -m "chore: generate release promotion draft"
          git push

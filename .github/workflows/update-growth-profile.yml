name: Update GitHub Growth Profile

on:
  workflow_dispatch:
  schedule:
    - cron: "15 8 * * 1"
  push:
    branches:
      - main
    paths-ignore:
      - "social-post-drafts.md"
      - "release-promotion-draft.md"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update profile README
        run: python scripts/update_profile.py

      - name: Generate social drafts
        run: python scripts/generate_social_posts.py

      - name: Commit generated updates
        run: |
          git config user.name "github-growth-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md social-post-drafts.md
          git diff --cached --quiet || git commit -m "chore: refresh profile and social drafts"
          git push
